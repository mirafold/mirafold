<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mirafold</title>
    <link rel="icon" href="data:," />
    <script>
      // Apply the stored theme before first paint so a light-theme user
      // never sees a dark flash (4.3). Shell keeps it in sync after mount.
      document.documentElement.dataset.theme =
        localStorage.getItem("genui-theme") === "light" ? "light" : "dark";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
