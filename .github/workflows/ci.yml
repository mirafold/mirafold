name: CI

# Runs the test suite automatically. Tiers (README §8): Tier 1 (unit) is
# seconds and runs on every push to main and every PR; Tier 2 (real daemon +
# sockets) and Tier 3 (headless Chrome, rebuilds dist) are minutes and run on
# PRs only (Kyle's call, 2026-07-22 — the full suite gates a merge, not every
# push). Tier 4 (`test:live`) NEVER runs here — it drives real binaries
# and one test spends a real OPENROUTER_API_KEY; no provider credential is ever
# added to repo secrets (PLAN C.1, 2026-07-20 audit).
#
# The harness forces credentials empty → MockSession, so there are no secrets to
# provision, no API spend, and no live-model flakiness (PLAN Phase C sizing).
# The DCO sign-off check is owed too (K.9) but is gated on the public flip; add
# it when the repo goes public (R.7).
#
# ONE cross-repo arrangement: server/relay/relay-service.itest.ts imports the
# relay under test from the SIBLING ../genui-relay checkout (README §"sibling
# itest"). Both jobs therefore check this repo out into genui-shell/ and
# mirafold-relay into genui-relay/, making them siblings under the workspace
# exactly as they are on a dev machine, and run with working-directory
# genui-shell. The relay is public since 2026-07-31, so the checkout needs no
# secret. It tracks the relay's default branch on purpose: the itest carries the
# contract guard that fails on drift between genui-relay/src/contract.ts and
# server/relay/relay-protocol.ts, and pinning a ref would blind it to exactly
# the drift it exists to catch. Consequence, accepted: a contract-breaking push
# to the relay turns this repo's CI red, which is the intended alarm.
#
# The release workflow does NOT do this — it stays a single-repo checkout and
# keeps using tsconfig.ci.json, so no other repo's branch can block a publish.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the auto-provisioned GITHUB_TOKEN: these jobs only read
# the code and run tests — they never push, comment, or release. Read-only
# matters most once the repo is public (R.7), when any fork PR runs on the
# runner: a malicious dependency install-script then can't use the token to
# write to the repo.
permissions:
  contents: read

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: typecheck + unit (Tier 1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genui-shell
    steps:
      - uses: actions/checkout@v5
        with:
          path: genui-shell
      # The sibling the itest imports from. Public since 2026-07-31 — the
      # default GITHUB_TOKEN reads it without any added secret.
      - uses: actions/checkout@v5
        with:
          repository: mirafold/mirafold-relay
          path: genui-relay
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: genui-shell/yarn.lock
      # The relay's own install: the typecheck follows the itest's imports into
      # genui-relay/src, which resolves `ws` and its types from genui-relay's
      # node_modules — module resolution walks up from that file and never
      # reaches this repo's node_modules, so the sibling needs its own install.
      - run: npm ci
        working-directory: genui-relay
      - run: yarn install --frozen-lockfile
      # Full tsconfig.json now — the sibling is present, so nothing is excluded.
      - run: yarn typecheck
      - run: yarn test

  integration:
    name: integration + e2e (Tier 2 + Tier 3)
    # PRs only — pushes to main get Tier 1; the slow tiers ran on the PR that
    # merged them (Kyle's call, 2026-07-22).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genui-shell
    steps:
      - uses: actions/checkout@v5
        with:
          path: genui-shell
      - uses: actions/checkout@v5
        with:
          repository: mirafold/mirafold-relay
          path: genui-relay
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: genui-shell/yarn.lock
      - run: npm ci
        working-directory: genui-relay
      - run: yarn install --frozen-lockfile
      # Tier 3 drives real headless Chrome via playwright-core; the harness
      # reads CHROME_BIN (default /usr/bin/google-chrome). ubuntu-latest ships
      # google-chrome-stable — resolve its path and hand it to the suite rather
      # than assume the default holds across runner image changes.
      - name: Locate Chrome
        run: |
          BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$BIN" ]; then
            echo "No Google Chrome on the runner" >&2
            exit 1
          fi
          echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN" --version
      # Tier 2, complete — including relay-service.itest.ts, which runs a real
      # daemon against the real sibling relay and carries the contract guard.
      - name: Tier 2 (integration, real daemon + sockets)
        run: yarn test:server
      - run: yarn test:e2e
