name: CI

# Runs the test suite automatically. Tiers (README §8): Tier 1 (unit) is
# seconds and runs on every push to main and every PR; Tier 2 (real daemon +
# sockets), Tier 3 (headless Chrome, rebuilds dist), and the compact managed-
# browser/visual UI gate are minutes and run on PRs only (Kyle's call,
# 2026-07-22 — the full suite gates a merge, not every push). Tier 4
# (`test:live`) NEVER runs here — it drives real binaries
# and one test spends a real OPENROUTER_API_KEY; no provider credential is ever
# added to repo secrets (PLAN C.1, 2026-07-20 audit).
#
# The harness forces credentials empty → MockSession, so there are no secrets to
# provision, no API spend, and no live-model flakiness (PLAN Phase C sizing).
# The DCO sign-off check is owed too (K.9) but is gated on the public flip; add
# it when the repo goes public (R.7).
#
# ONE cross-repo arrangement: server/relay/relay-service.itest.ts imports the
# relay under test from the SIBLING ../mirafold-relay checkout (README §"sibling
# itest"). Both jobs therefore check this repo out into mirafold/ and
# mirafold-relay into mirafold-relay/, making them siblings under the workspace
# exactly as they are on a dev machine, and run with working-directory
# mirafold. The relay is public since 2026-07-31, so the checkout needs no
# secret. It tracks the relay's default branch on purpose: the itest carries the
# contract guard that fails on drift between mirafold-relay/src/contract.ts and
# server/relay/relay-protocol.ts, and pinning a ref would blind it to exactly
# the drift it exists to catch. Consequence, accepted: a contract-breaking push
# to the relay turns this repo's CI red, which is the intended alarm.
#
# The release workflow does NOT do this — it stays a single-repo checkout and
# keeps using tsconfig.ci.json, so no other repo's branch can block a publish.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the auto-provisioned GITHUB_TOKEN: these jobs only read
# the code and run tests — they never push, comment, or release. Read-only
# matters most once the repo is public (R.7), when any fork PR runs on the
# runner: a malicious dependency install-script then can't use the token to
# write to the repo.
permissions:
  contents: read

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: typecheck + unit (Tier 1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mirafold
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: mirafold
      # The sibling the itest imports from. Public since 2026-07-31 — the
      # default GITHUB_TOKEN reads it without any added secret.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: mirafold/mirafold-relay
          path: mirafold-relay
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: mirafold/yarn.lock
      # The relay's own install: the typecheck follows the itest's imports into
      # mirafold-relay/src, which resolves `ws` and its types from
      # mirafold-relay's
      # node_modules — module resolution walks up from that file and never
      # reaches this repo's node_modules, so the sibling needs its own install.
      - run: npm ci
        working-directory: mirafold-relay
      - run: yarn install --frozen-lockfile
      # Full tsconfig.json now — the sibling is present, so nothing is excluded.
      - run: yarn typecheck
      - run: yarn test

  integration:
    name: integration + e2e (Tier 2 + Tier 3)
    # PRs only — pushes to main get Tier 1; the slow tiers ran on the PR that
    # merged them (Kyle's call, 2026-07-22).
    if: github.event_name == 'pull_request'
    # Visual baselines are OS-renderer-specific. Pin the image named by the
    # committed PNGs instead of letting ubuntu-latest silently change pixels.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mirafold
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: mirafold
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: mirafold/mirafold-relay
          path: mirafold-relay
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: mirafold/yarn.lock
      - run: npm ci
        working-directory: mirafold-relay
      - run: yarn install --frozen-lockfile
      # The compact UI gate uses Playwright's revision-matched Chromium,
      # Firefox, and WebKit. The binaries (~400 MB) are cached per
      # playwright-core version; --with-deps still runs every time because it
      # is what installs WebKit's apt host libraries on a clean runner.
      # Cache scope: a pull request can only READ caches written by its base
      # branch and WRITE its own branch-scoped entry, so a fork cannot plant
      # browser binaries that a later trusted run would restore.
      - name: Cache managed UI browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('mirafold/node_modules/playwright-core/package.json') }}
      - name: Install managed UI browsers
        run: yarn playwright-core install --with-deps chromium firefox webkit
      # Tier 3 drives real headless Chrome via playwright-core; the harness
      # reads CHROME_BIN (default /usr/bin/google-chrome). ubuntu-24.04 ships
      # google-chrome-stable — resolve its path and hand it to the suite rather
      # than assume the default holds across runner image changes.
      - name: Locate Chrome
        run: |
          BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$BIN" ]; then
            echo "No Google Chrome on the runner" >&2
            exit 1
          fi
          echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN" --version
      # Tier 2 asserts against the SERVED shell page (headers.itest.ts), so the
      # front end must exist first: without dist/, Express's own 404 handler
      # answers `/` and REPLACES our CSP with its `default-src 'none'` — the
      # daemon's header never reaches the probe (first CI run, 2026-08-04).
      # Dev machines always have a build; CI checkouts start without one.
      - run: yarn build
      # Tier 2, complete — including relay-service.itest.ts, which runs a real
      # daemon against the real sibling relay and carries the contract guard.
      - name: Tier 2 (integration, real daemon + sockets)
        run: yarn test:server
      - run: yarn test:e2e
      # `dist` was just built by test:e2e; run the gate against it.
      - name: Cross-engine + visual UI gate
        run: yarn test:ui:built
        env:
          MIRAFOLD_UI_ARTIFACT_DIR: ${{ runner.temp }}/mirafold-ui-visual
      # A numerical pixel count is enough to fail the gate; these files make
      # the failure diagnosable without reproducing it on the runner.
      - name: Preserve visual diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-visual-diffs
          path: ${{ runner.temp }}/mirafold-ui-visual
          if-no-files-found: ignore
